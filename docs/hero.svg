<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <line x1="440" y1="28" x2="440" y2="272" stroke="#d8dee4" stroke-dasharray="4 5"/>

  <!-- ===== left: without ===== -->
  <circle cx="44" cy="39" r="6" fill="#cf222e"/>
  <text x="58" y="45" font-size="17" font-weight="600" fill="#1f2328">Without SMC Reader</text>

  <rect x="36" y="114" width="150" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="111" y="141" font-size="13" text-anchor="middle" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">$ seq 1 3000</text>
  <path d="M186 136 H236" stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="244" y="66" width="164" height="196" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="326" y="88" font-size="12" text-anchor="middle" fill="#57606a">model context</text>
  <rect x="256" y="98" width="140" height="150" rx="6" fill="#ffebe9" stroke="#cf222e"/>
  <text x="326" y="164" font-size="24" font-weight="700" text-anchor="middle" fill="#a40e26">13.9 KB</text>
  <text x="326" y="186" font-size="11.5" text-anchor="middle" fill="#a40e26">all 3000 lines,</text>
  <text x="326" y="201" font-size="11.5" text-anchor="middle" fill="#a40e26">re-read on every turn</text>
  <text x="326" y="216" font-size="11.5" text-anchor="middle" fill="#a40e26">until the session ends</text>

  <!-- ===== right: with ===== -->
  <circle cx="474" cy="39" r="6" fill="#1a7f37"/>
  <text x="488" y="45" font-size="17" font-weight="600" fill="#1f2328">With SMC Reader</text>

  <rect x="466" y="114" width="118" height="44" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="525" y="141" font-size="13" text-anchor="middle" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">$ seq 1 3000</text>
  <path d="M584 136 H604" stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <rect x="610" y="118" width="70" height="36" rx="18" fill="#ddf4ff" stroke="#0969da"/>
  <text x="645" y="141" font-size="12.5" font-weight="600" text-anchor="middle" fill="#0550ae">hook</text>

  <!-- hook -> disk -->
  <path d="M645 154 V196" stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <ellipse cx="645" cy="206" rx="46" ry="9" fill="#f6f8fa" stroke="#8c959f"/>
  <path d="M599 206 V246 A46 9 0 0 0 691 246 V206" fill="#f6f8fa" stroke="#8c959f"/>
  <ellipse cx="645" cy="206" rx="46" ry="9" fill="#eaeef2" stroke="#8c959f"/>
  <text x="645" y="232" font-size="12" font-weight="600" text-anchor="middle" fill="#1f2328">13.9 KB</text>
  <text x="645" y="247" font-size="10.5" text-anchor="middle" fill="#57606a">on disk</text>

  <!-- hook -> context (pointer) -->
  <path d="M680 136 H714" stroke="#1a7f37" stroke-width="2" fill="none" marker-end="url(#arrg)"/>

  <rect x="720" y="66" width="140" height="196" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="790" y="88" font-size="12" text-anchor="middle" fill="#57606a">model context</text>
  <rect x="732" y="118" width="116" height="36" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="790" y="134" font-size="12" font-weight="700" text-anchor="middle" fill="#116329">~1 KB pointer</text>
  <text x="790" y="148" font-size="10" text-anchor="middle" fill="#116329">head + tail + id</text>
  <rect x="732" y="170" width="116" height="40" rx="6" fill="#ffffff" stroke="#1a7f37" stroke-dasharray="4 3"/>
  <text x="790" y="187" font-size="11" text-anchor="middle" fill="#116329">only the lines</text>
  <text x="790" y="201" font-size="11" text-anchor="middle" fill="#116329">you ask for</text>

  <!-- disk -> context (pull) -->
  <path d="M691 228 C712 228 712 192 728 192" stroke="#1a7f37" stroke-width="2" fill="none" marker-end="url(#arrg)"/>
  <text x="790" y="236" font-size="10.5" text-anchor="middle" fill="#57606a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">reader_peek</text>
  <text x="790" y="250" font-size="10.5" text-anchor="middle" fill="#57606a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">reader_ask</text>
</svg>
