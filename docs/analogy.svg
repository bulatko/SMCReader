<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8c959f"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8250df"/></marker>
    <marker id="k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- ================= 1: intercept ================= -->
  <rect x="20" y="20" width="268" height="260" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="44" cy="46" r="13" fill="#0969da"/><text x="44" y="51" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <text x="66" y="51" font-size="14" font-weight="600" fill="#1f2328">Opus runs a command</text>

  <circle cx="54" cy="98" r="16" fill="#fbefe9" stroke="#d97757" stroke-width="1.5"/>
  <text x="54" y="103" font-size="12" font-weight="700" text-anchor="middle" fill="#a8461f">O</text>
  <rect x="82" y="82" width="190" height="32" rx="6" fill="#24292f"/>
  <text x="94" y="103" font-size="12" fill="#e6edf3" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">$ npm test</text>

  <!-- output stack -->
  <path d="M226 114 V130" stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#g)"/>
  <rect x="200" y="140" width="56" height="62" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <rect x="196" y="136" width="56" height="62" rx="3" fill="#ffffff" stroke="#8c959f"/>
  <line x1="203" y1="148" x2="245" y2="148" stroke="#d0d7de"/><line x1="203" y1="157" x2="241" y2="157" stroke="#d0d7de"/>
  <line x1="203" y1="166" x2="245" y2="166" stroke="#d0d7de"/><line x1="203" y1="175" x2="239" y2="175" stroke="#d0d7de"/>
  <line x1="203" y1="184" x2="245" y2="184" stroke="#d0d7de"/>
  <text x="224" y="214" font-size="10.5" text-anchor="middle" fill="#57606a">3,000 lines</text>

  <!-- output tries to reach Opus: blocked -->
  <path d="M194 166 H134" stroke="#cf222e" stroke-width="2" fill="none" marker-end="url(#r)"/>
  <path d="M120 166 H74" stroke="#d0d7de" stroke-width="2" stroke-dasharray="3 4" fill="none"/>
  <path d="M74 166 Q54 166 54 120" stroke="#d0d7de" stroke-width="2" stroke-dasharray="3 4" fill="none"/>
  <rect x="122" y="136" width="10" height="62" rx="3" fill="#cf222e"/>
  <text x="127" y="214" font-size="10.5" font-weight="700" text-anchor="middle" fill="#cf222e">SMC Reader</text>
  <text x="127" y="228" font-size="10" text-anchor="middle" fill="#cf222e">hook</text>

  <!-- diverted to disk -->
  <path d="M256 170 C 270 176, 272 200, 264 214" stroke="#8c959f" stroke-width="1.8" fill="none" marker-end="url(#g)"/>
  <text x="270" y="232" font-size="10.5" text-anchor="end" fill="#57606a">→ disk</text>

  <text x="154" y="252" font-size="12" text-anchor="middle" fill="#1f2328">The output never reaches Opus:</text>
  <text x="154" y="269" font-size="12" text-anchor="middle" fill="#1f2328">the hook catches it and saves it to disk.</text>

  <!-- ================= 2: the note ================= -->
  <rect x="306" y="20" width="268" height="260" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="330" cy="46" r="13" fill="#0969da"/><text x="330" y="51" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <text x="352" y="51" font-size="14" font-weight="600" fill="#1f2328">Opus gets a note instead</text>

  <rect x="322" y="70" width="236" height="122" rx="8" fill="#dafbe1" stroke="#1a7f37"/>
  <path d="M344 192 L338 210 L362 192 z" fill="#dafbe1" stroke="#1a7f37" stroke-linejoin="round"/>
  <line x1="345" y1="192" x2="361" y2="192" stroke="#dafbe1" stroke-width="2"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#1f2328">
    <text x="334" y="90" font-weight="700" fill="#116329">[READER ctx_b4c9] output caught:</text>
    <text x="334" y="106">3,000 lines, saved to disk.</text>
    <text x="334" y="122" fill="#57606a">1 · 2 · 3 … 2999 · 3000</text>
    <text x="334" y="144" fill="#116329">To read it, ask the reader:</text>
    <text x="334" y="160">reader_ask(id, question)</text>
    <text x="334" y="176">reader_peek(id, from, to)</text>
  </g>
  <circle cx="340" cy="226" r="16" fill="#fbefe9" stroke="#d97757" stroke-width="1.5"/>
  <text x="340" y="231" font-size="12" font-weight="700" text-anchor="middle" fill="#a8461f">O</text>
  <text x="364" y="224" font-size="11" fill="#57606a">~1 KB in Opus's context</text>
  <text x="364" y="238" font-size="11" fill="#57606a">instead of 13.9 KB</text>

  <text x="440" y="262" font-size="12" text-anchor="middle" fill="#1f2328">It says what was caught and how to read it.</text>

  <!-- ================= 3: ask ================= -->
  <rect x="592" y="20" width="268" height="260" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle cx="616" cy="46" r="13" fill="#0969da"/><text x="616" y="51" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <text x="638" y="51" font-size="14" font-weight="600" fill="#1f2328">Opus asks, Haiku answers</text>

  <circle cx="624" cy="104" r="16" fill="#fbefe9" stroke="#d97757" stroke-width="1.5"/>
  <text x="624" y="109" font-size="12" font-weight="700" text-anchor="middle" fill="#a8461f">O</text>
  <circle cx="836" cy="104" r="16" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <text x="836" y="109" font-size="12" font-weight="700" text-anchor="middle" fill="#6639ba">H</text>
  <text x="836" y="134" font-size="10.5" text-anchor="middle" fill="#57606a">Haiku</text>

  <path d="M644 104 H814" stroke="#8250df" stroke-width="2" fill="none" marker-end="url(#v)"/>
  <text x="729" y="96" font-size="11.5" text-anchor="middle" fill="#1f2328">“Which test failed and why?”</text>
  <text x="729" y="120" font-size="10.5" text-anchor="middle" fill="#6639ba" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">reader_ask</text>

  <text x="822" y="152" font-size="10" text-anchor="middle" fill="#6639ba">reads all</text>
  <text x="822" y="164" font-size="10" text-anchor="middle" fill="#6639ba">3,000 lines</text>

  <rect x="606" y="178" width="214" height="46" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="616" y="197" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">1830: ERROR worker-03 invoice</text>
  <text x="616" y="213" font-size="10.5" fill="#1f2328" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">INV-88412 1240.00 ≠ 1204.00</text>
  <path d="M836 172 C 836 196, 832 200, 824 200" stroke="#1a7f37" stroke-width="2" fill="none" marker-end="url(#k)"/>
  <path d="M624 176 V124" stroke="#1a7f37" stroke-width="2" fill="none" marker-end="url(#k)"/>

  <text x="726" y="252" font-size="12" text-anchor="middle" fill="#1f2328">Haiku reads everything;</text>
  <text x="726" y="269" font-size="12" text-anchor="middle" fill="#1f2328">Opus gets back only the 2 lines that matter.</text>
</svg>
